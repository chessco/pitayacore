name: CI Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-api:
    name: Lint & Build (API)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'api/package-lock.json'

      - name: Install dependencies
        working-directory: api
        run: npm ci

      - name: Generate Prisma clients
        working-directory: api
        run: |
          npx prisma generate --schema=prisma/mysql.prisma
          npx prisma generate --schema=prisma/postgres.prisma

      - name: Build API
        working-directory: api
        run: npm run build

      - name: Lint API (advisory)
        working-directory: api
        run: npm run lint
        continue-on-error: true

  test-web:
    name: Build & Verify (Web)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build Web
        working-directory: web
        run: npm run build

      - name: Lint Web (advisory)
        working-directory: web
        run: npm run lint
        continue-on-error: true
