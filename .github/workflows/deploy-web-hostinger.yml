name: Deploy Web to Hostinger

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web-hostinger.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build & Deploy Web to Hostinger
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build Vite application
        working-directory: web
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://pitayacore-api.pitayacode.io' }}
        run: npm run build

      - name: Deploy to Hostinger via SSH
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT || 65002 }}
          REMOTE_PATH: ${{ secrets.HOSTINGER_PATH || 'domains/pitayacore.pitayacode.io/public_html' }}
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hostinger_deploy_key
          chmod 600 ~/.ssh/hostinger_deploy_key

          echo "🚀 Subiendo y extrayendo bundle en Hostinger..."
          tar -czf - -C web/dist . | ssh -p "$SSH_PORT" -i ~/.ssh/hostinger_deploy_key -o StrictHostKeyChecking=no "${SSH_USER}@${SSH_HOST}" "mkdir -p ${REMOTE_PATH} && cd ${REMOTE_PATH} && tar -xz -f -"
          echo "✅ Despliegue en Hostinger completado exitosamente."

      - name: Clean temporary credentials
        if: always()
        run: rm -f ~/.ssh/hostinger_deploy_key
