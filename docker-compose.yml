services:
  mysql:
    image: mysql:8
    container_name: pitaya-mysql-prod
    restart: always
    env_file:
      - ./api/.env.prod
    ports:
      - "3306:3306"
    volumes:
      - pitaya_mysql_data:/var/lib/mysql
    networks:
      - pitayacode_net

  postgres:
    image: pgvector/pgvector:pg16
    container_name: pitaya-postgres-prod
    restart: always
    env_file:
      - ./api/.env.prod
    ports:
      - "5434:5432"
    volumes:
      - pitaya_postgres_data:/var/lib/postgresql/data
    networks:
      - pitayacode_net

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: pitayacore-api
    restart: always
    env_file:
      - ./api/.env.prod
    environment:
      PORT: 3015
    ports:
      - "3015:3015"
    networks:
      - pitayacode_net
    depends_on:
      - mysql
      - postgres

  flow:
    image: node:20-alpine
    container_name: pitayacore-flow
    restart: always
    command: ["tail", "-f", "/dev/null"] # Placeholder for flow service
    networks:
      - pitayacode_net

networks:
  pitayacode_net:
    external: true

volumes:
  pitaya_mysql_data:
  pitaya_postgres_data:
