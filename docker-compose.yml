services:
  mysql:
    image: mysql:8
    container_name: pitayacore-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    env_file:
      - ./api/.env.pitayacore
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - pitaya_net

  postgres:
    image: pgvector/pgvector:pg16
    container_name: pitayacore-pgvector
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    env_file:
      - ./api/.env.pitayacore
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pitaya_net

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: pitayacore-api
    restart: always
    env_file:
      - ./api/.env.pitayacore
    environment:
      DATABASE_URL: ${DATABASE_URL}
      VECTOR_DATABASE_URL: ${VECTOR_DATABASE_URL}
      PORT: 3015
    ports:
      - "3015:3015"
    networks:
      - pitaya_net
    depends_on:
      - mysql
      - postgres

  flow:
    image: node:20-alpine
    container_name: pitayacore-flow
    restart: always
    command: ["tail", "-f", "/dev/null"] # Placeholder for flow service
    networks:
      - pitaya_net

networks:
  pitaya_net:
    external: true

volumes:
  mysql_data:
  postgres_data:
