services:
  mysql:
    image: mysql:8
    container_name: pitayacore-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: acuacore_pass
      MYSQL_DATABASE: pitayacore_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - pitaya_net

  postgres:
    image: ankane/pgvector:latest
    container_name: pitayacore-pgvector
    restart: always
    environment:
      POSTGRES_USER: acuacore_user
      POSTGRES_PASSWORD: acuacore_pass
      POSTGRES_DB: pitayacore_vector
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pitaya_net

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: pitayacore-api
    restart: always
    env_file:
      - ./api/.env.pitayacore
    environment:
      DATABASE_URL: "mysql://root:acuacore_pass@pitayacore-mysql:3306/pitayacore_db"
      VECTOR_DATABASE_URL: "postgresql://acuacore_user:acuacore_pass@pitayacore-pgvector:5432/pitayacore_vector"
      PORT: 3015
    ports:
      - "3015:3015"
    networks:
      - pitaya_net
    depends_on:
      - mysql
      - postgres

  flow:
    image: node:20-alpine
    container_name: pitayacore-flow
    restart: always
    command: ["tail", "-f", "/dev/null"] # Placeholder for flow service
    networks:
      - pitaya_net

networks:
  pitaya_net:
    external: true

volumes:
  mysql_data:
  postgres_data:
